<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quran Deep Study</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--card:#fff;--text:#1a2028;--muted:#5b6572;--soft:#7a8492;--primary:#0d6b4f;--psoft:#e6f3ee;--bd:#dde3ea;--bs:#eef1f5;--accent:#b8860b}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:15px}
a{color:var(--primary)}
.tb{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);padding:10px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tb .brand{font-weight:700;color:var(--primary);margin-right:auto}
.tb input{font:inherit;font-size:13px;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;min-width:220px}
.tb input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--psoft)}
.btn{font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:#fff;color:var(--text);cursor:pointer}
.btn:hover{background:#f5f7fa}
.btnp{background:var(--primary);border-color:var(--primary);color:#fff}
.btnp:hover{background:#084d38}
.wrap{max-width:920px;margin:0 auto;padding:22px 18px 90px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px 22px;margin-bottom:18px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.05)}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--primary);margin:0 0 14px;font-weight:700;display:flex;align-items:center;gap:10px}
.card h3:after{content:"";flex:1;height:1px;background:var(--bd)}
.dh{background:linear-gradient(135deg,#0d6b4f,#0a5942);color:#fff;border-radius:14px;padding:26px;margin-bottom:20px;box-shadow:0 8px 24px rgba(16,24,40,.08)}
.dk{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;opacity:.85;font-weight:600;margin-bottom:4px}
.dh h1{margin:0 0 6px;font-size:26px;line-height:1.2;letter-spacing:-.3px}
.dr{font-size:14px;opacity:.95;margin-bottom:14px}
.dm{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;opacity:.9;border-top:1px solid rgba(255,255,255,.18);padding-top:12px}
.dn{margin-top:12px;background:rgba(255,255,255,.12);border-left:3px solid rgba(255,255,255,.5);padding:9px 12px;border-radius:6px;font-size:12px;line-height:1.55}
.ar{font-family:Amiri,'Traditional Arabic',serif;direction:rtl;text-align:right;font-size:26px;line-height:1.9;color:#14231d;margin:6px 0 10px}
.tr{font-style:italic;color:var(--soft);font-size:13px;margin-bottom:6px}
.ru{color:#2c3a30;font-size:14.5px;margin-bottom:4px}
.en{color:var(--muted);font-size:13.5px}
.pass{padding:14px 0;border-bottom:1px dashed var(--bd)}
.pass:last-child{border:none;padding-bottom:0}
.ref{display:inline-block;font-size:11px;font-weight:700;color:var(--primary);background:var(--psoft);padding:2px 8px;border-radius:4px;margin-bottom:8px}
.ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.ii{background:var(--psoft);border-radius:10px;padding:11px 13px}
.ii .k{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--primary);font-weight:700;margin-bottom:3px}
.ii .v{font-size:13.5px;font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag,.pill{background:var(--psoft);color:var(--primary);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500}
.sec{padding:12px 0;border-bottom:1px solid var(--bs)}
.sec:last-child{border:none;padding-bottom:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px;flex-wrap:wrap}
.sec-t{font-size:15px;font-weight:700;color:var(--primary)}
.sec-r{font-size:11px;font-weight:600;color:var(--primary);background:var(--psoft);padding:2px 10px;border-radius:12px}
.sec-th{font-size:13px;color:var(--muted);font-style:italic;margin-bottom:6px}
.sec p{margin:3px 0;font-size:13.5px}
.sec p.note{background:#fafbfc;border-left:3px solid var(--accent);padding:7px 11px;border-radius:0 6px 6px 0;font-size:12.5px;margin-top:7px}
.ac{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:22px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.05);overflow:hidden}
.ah{background:linear-gradient(135deg,#f5f9f7,#eef4f1);padding:14px 22px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--bd)}
.an{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.ah .rl{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--primary);font-weight:700}
.ah .rv{font-size:17px;font-weight:700;color:var(--primary)}
.ab{padding:20px 22px}
.arb{background:#fbfdfc;border:1px solid var(--bs);border-radius:10px;padding:16px 20px;margin-bottom:16px}
.arb .ar{margin:0 0 10px;font-size:27px}
.arb .tr,.arb .ru,.arb .en{margin:0 0 6px}
.arb .en{margin:0}
.blk{margin-bottom:14px}
.blk:last-child{margin-bottom:0}
.blk h4{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--primary);margin:0 0 5px;font-weight:700}
.blk p{margin:0 0 6px;font-size:13.5px}
.blk p:last-child{margin:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.g2{grid-template-columns:1fr}}
.blk.inset{background:#f8fafb;border-radius:8px;padding:11px 13px}
.blk.mis{background:#fff8f0;border-left:3px solid #e8a33d;padding:11px 13px;border-radius:0 8px 8px 0}
.blk.mis h4{color:#b06a10}
.blk.ref{background:var(--psoft);border-left:3px solid var(--primary);padding:11px 13px;border-radius:0 8px 8px 0}
.wl{display:flex;flex-direction:column;gap:8px}
.wi{border:1px solid var(--bs);border-radius:9px;padding:10px 12px;background:#fcfdfe}
.wh{display:flex;align-items:baseline;flex-wrap:wrap;gap:5px 10px;margin-bottom:6px}
.wa{font-family:Amiri,serif;font-size:21px;color:var(--primary);direction:rtl}
.wt{font-style:italic;color:var(--soft);font-size:13px}
.wm{font-weight:600;font-size:13px}
.wd{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:3px 14px;font-size:12px;color:var(--muted)}
.wd b{color:var(--soft);font-weight:600}
.qa{border-left:3px solid var(--primary);padding:3px 0 3px 11px;margin-bottom:9px}
.qa:last-child{margin:0}
.qq{font-weight:600;font-size:13px;color:var(--primary);margin-bottom:2px}
.qa-a{font-size:13px;color:var(--muted)}
.ev{border:1px solid var(--bs);border-radius:8px;padding:9px 11px;background:#fafbfc;margin-bottom:7px;font-size:13px}
.ev:last-child{margin:0}
.eh{display:flex;align-items:center;gap:7px;margin-bottom:3px;flex-wrap:wrap}
.et{font-size:10px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;color:var(--primary);background:var(--psoft);padding:2px 7px;border-radius:4px}
.er{font-size:11.5px;color:var(--soft);font-style:italic}
.es{font-size:10.5px;font-weight:600;color:var(--muted);margin-left:auto}
.sl{color:#b06a10!important}.su{color:#b03030!important}
.si{padding:11px 0;border-bottom:1px solid var(--bs)}
.si:last-child{border:none;padding-bottom:0}
.st{font-size:10px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;color:var(--primary);margin-bottom:2px}
.stt{font-weight:600;font-size:13.5px;margin-bottom:2px}
.sr{font-size:12.5px;color:var(--muted);margin-bottom:2px}
.su2{font-size:11.5px;color:var(--soft);word-break:break-all}
.ai{border:1px solid var(--bs);border-radius:9px;padding:11px 13px;margin-bottom:9px;background:#fcfdfe}
.ai:last-child{margin:0}
.aih{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px;flex-wrap:wrap}
.ain{font-weight:700;color:var(--primary);font-size:13.5px}
.aif{font-size:11px;font-weight:600;color:var(--primary);background:var(--psoft);padding:2px 10px;border-radius:10px}
.ai p{margin:2px 0;font-size:13px;color:var(--muted)}
.ai p b{color:var(--text)}
.hb{background:linear-gradient(135deg,#0d6b4f,#0a5942);color:#fff;border-radius:11px;padding:16px 18px;margin-top:12px;font-size:14.5px;line-height:1.6;font-weight:500}
.hb .hl{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;opacity:.8;margin-bottom:5px;font-weight:700}
.st2{max-width:520px;margin:70px auto;background:#fff;border-radius:14px;padding:34px 30px;box-shadow:0 8px 24px rgba(16,24,40,.08);text-align:center}
.st2 h2{margin:0 0 8px;font-size:19px;color:var(--primary)}
.st2 p{color:var(--muted);font-size:14px;margin:0 0 16px}
.st2 input{width:100%;font:inherit;font-size:14px;padding:11px 14px;border:1px solid var(--bd);border-radius:10px;margin-bottom:11px}
.st2 input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--psoft)}
.hint{font-size:12px;color:var(--soft);margin-top:12px;line-height:1.6;text-align:left;background:#f8fafb;padding:11px 13px;border-radius:8px}
.hint code{background:#eef1f5;padding:1px 5px;border-radius:3px;font-size:11.5px}
.sp{width:34px;height:34px;border:3px solid var(--psoft);border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:#b03030}
.pf{display:none}
@media print{
@page{size:A4;margin:14mm 12mm 16mm 12mm}
html,body{background:#fff!important;font-size:10pt;line-height:1.5;color:#000}
.no-print{display:none!important}
.wrap{max-width:none;padding:0;margin:0}
.card,.ac,.dh{box-shadow:none!important}
.card{border:1px solid #ccc;border-radius:6px;padding:11px 13px;margin-bottom:11px}
.ac{border:1px solid #ccc;border-radius:6px;margin-bottom:13px;overflow:visible}
.ah{padding:9px 13px;background:#f1f5f3!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ab{padding:11px 13px 13px}
.dh{background:#0d6b4f!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:16px 18px 13px;border-radius:6px;margin-bottom:13px}
.dh h1{font-size:20px}.dr{font-size:11px;margin-bottom:9px}
.dm{font-size:10px;padding-top:7px;gap:5px 12px}.dn{font-size:10px;padding:7px 9px;margin-top:9px}
.card h3{font-size:10.5px;margin-bottom:9px}
.ar{font-size:19px;line-height:1.7}
.arb{padding:9px 13px;margin-bottom:11px}.arb .ar{font-size:21px;margin-bottom:7px}
.tr,.en{font-size:10.5px}.ru{font-size:11.5px}
.blk{margin-bottom:9px}.blk h4{font-size:10px;margin-bottom:3px}
.blk p,.sec p{font-size:10.5px;margin-bottom:4px}
.sec-t{font-size:12.5px}.sec-r{font-size:9.5px}.sec-th{font-size:10.5px}
.sec{padding:7px 0}.sec p.note{font-size:10px;padding:5px 8px}
.wi{padding:7px 9px}.wa{font-size:16px}.wt,.wm{font-size:10.5px}
.wd{font-size:9.5px;gap:2px 10px}
.ev{padding:6px 8px;font-size:10.5px;margin-bottom:5px}
.et{font-size:8.5px;padding:1px 5px}.er{font-size:9.5px}.es{font-size:9px}
.qq,.qa-a{font-size:10.5px}
.si{padding:6px 0}.st{font-size:8.5px}.stt{font-size:11.5px}.sr{font-size:10.5px}.su2{font-size:9px}
.ai{padding:7px 9px;margin-bottom:6px}.ain{font-size:11.5px}.aif{font-size:9px}.ai p{font-size:10.5px}
.hb{padding:11px 13px;font-size:11.5px}.hb .hl{font-size:9px}
.ii{padding:7px 9px}.ii .k{font-size:9px}.ii .v{font-size:11px}
.tag,.pill{font-size:9.5px;padding:2px 8px}
.avoid,.wi,.qa,.ev,.ai,.si,.sec,.ii,.pass{break-inside:avoid;page-break-inside:avoid}
h1,h2,h3,h4{break-after:avoid;page-break-after:avoid}
.ah{break-after:avoid}
a{color:#000;text-decoration:none}
.pf{display:block!important;position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:9pt;color:#888;padding:3mm 0;background:#fff}
.pf:after{content:"Page " counter(page)}
}
</style>
</head>
<body>

<div class="tb no-print">
  <div class="brand">Quran Deep Study</div>
  <input id="fi" placeholder="filename e.g. QURAN-DEEP-001_Al-Fatihah_1-7 (1).json">
  <button class="btn" id="lb">Load</button>
  <button class="btn btnp" id="pb">🖨 Print / Save PDF</button>
</div>

<div id="ct" class="wrap"></div>
<div class="pf" aria-hidden="true"></div>

<script>
(function(){
'use strict';
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ct=document.getElementById('ct'),fi=document.getElementById('fi'),lb=document.getElementById('lb'),pb=document.getElementById('pb');
const P=t=>t?`<p>${e(t)}</p>`:'';
const B=(l,b,c)=>b?`<div class="blk ${c||''}"><h4>${e(l)}</h4>${b}</div>`:'';

function norm(n){let f=String(n||'').trim();if(!f)return'';if(!/\.json$/i.test(f))f+='.json';return f}

function loading(){ct.innerHTML=`<div class="st2"><div class="sp"></div><h2>Loading…</h2><p>Study data load ho raha hai.</p></div>`}

function errScreen(m,d){ct.innerHTML=`<div class="st2"><h2 class="err">Data load nahi ho paya</h2><p>${e(m)}</p>${d?`<div class="hint"><b>Detail:</b> ${e(d)}</div>`:''}<div class="hint"><b>Check:</b><br>• File <code>my-folder/data/</code> me honi chahiye<br>• URL: <code>index.html?file=NAME.json</code><br>• Local server chalayein: <code>python -m http.server 8000</code></div></div>`}

function picker(){ct.innerHTML=`<div class="st2"><h2>Quran Deep Study</h2><p>Data file ka naam daalein.</p><input id="pi" placeholder="QURAN-DEEP-001_Al-Fatihah_1-7 (1).json"><button class="btn btnp" id="pbtn" style="width:100%">Load Study</button><div class="hint"><b>Example URL:</b><br><code>index.html?file=QURAN-DEEP-001_Al-Fatihah_1-7 (1).json</code></div></div>`;
const pi=document.getElementById('pi'),pbtn=document.getElementById('pbtn');
const go=()=>{const v=pi.value.trim();if(!v)return;const u=new URL(location.href);u.searchParams.set('file',v);location.href=u.toString()};
pbtn.onclick=go;pi.onkeydown=ev=>{if(ev.key==='Enter')go()};pi.focus()}

function word(w){return`<div class="wi"><div class="wh"><span class="wa" dir="rtl">${e(w.arabic)}</span><span class="wt">${e(w.transliteration)}</span><span class="wm">${e(w.meaning)}</span></div><div class="wd">${w.root?`<span><b>Root:</b> ${e(w.root)}</span>`:''}${w.word_form?`<span><b>Form:</b> ${e(w.word_form)}</span>`:''}${w.literal_meaning?`<span><b>Literal:</b> ${e(w.literal_meaning)}</span>`:''}${w.contextual_meaning?`<span><b>Context:</b> ${e(w.contextual_meaning)}</span>`:''}</div></div>`}

function ayah(a){
const w=(a.important_arabic_words||[]).map(word).join('');
const qa=(a.qa||[]).map(x=>`<div class="qa"><div class="qq">Q: ${e(x.q)}</div><div class="qa-a">A: ${e(x.a)}</div></div>`).join('');
const hd=a.hadith?`<div class="ev"><div class="eh"><span class="et">Hadith</span><span class="er">${e(a.hadith.reference||'')}</span><span class="es">${e(a.hadith.status||'')}</span></div><div>${e(a.hadith.summary||'')}</div></div>`:'';
const sc=a.science?`<div class="ev"><div class="eh"><span class="et">Science</span><span class="es ${e(a.science.status_class||'')}">${e(a.science.status||'')}</span></div><div>${e(a.science.summary||'')}</div></div>`:'';
const he=a.history_evidence?`<div class="ev"><div class="eh"><span class="et">History / Evidence</span></div><div>${e(a.history_evidence)}</div></div>`:'';
return`<article class="ac"><header class="ah"><div class="an">${e(a.ayah)}</div><div><div class="rl">Ayah ${e(a.ayah)}</div><div class="rv">${e(a.reference)}</div></div></header><div class="ab"><div class="arb"><div class="ar" dir="rtl">${e(a.arabic)}</div><div class="tr">${e(a.transliteration)}</div><div class="ru">${e(a.roman_urdu)}</div><div class="en">${e(a.english_meaning)}</div></div>${B('Simple',P(a.simple))}${B('Deep',P(a.deep))}<div class="g2">${B('Main Message',P(a.main_message))}${B('Why It Matters',P(a.why_it_matters))}</div>${w?B('Important Arabic Words',`<div class="wl">${w}</div>`):''}${B('Grammar & Rhetoric',P(a.grammar_rhetoric))}${B('Historical Context',P(a.historical_context))}<div class="g2">${B('Common Misunderstandings',P(a.common_misunderstandings),'mis')}${B('What It Does NOT Mean',P(a.what_it_does_not_mean),'mis')}</div>${B('Connected Ayat',P(a.connected_ayat))}${B('Knowledge Status',P(a.knowledge_status))}${(hd||sc||he)?`<div class="blk"><h4>Evidence Layer</h4>${hd}${he}${sc}</div>`:''}${B('Real Life Example',P(a.real_life_example),'inset')}${B('Modern World Connection',P(a.modern_world_connection),'inset')}${B('Forward-Looking',P(a.future_or_forward_looking_context),'inset')}${qa?B('Q & A',qa):''}<div class="g2">${B('Night Reflection',P(a.night_reflection),'ref')}${B('Personal Action',P(a.personal_action),'ref')}</div></div></article>`}

function info(si){const c=si.classification||{};return`<section class="card"><h3>Surah Info</h3><div class="ig"><div class="ii"><div class="k">Name</div><div class="v">${e(si.name_meaning)}</div></div><div class="ii"><div class="k">Class</div><div class="v">${e(c.makki_or_madani||'')}</div></div><div class="ii"><div class="k">Ayat</div><div class="v">${e(c.ayat_count!=null?c.ayat_count:'')}</div></div></div>${P(si.introduction)}${si.what?`<p><b>What:</b> ${e(si.what)}</p>`:''}${si.why?`<p><b>Why:</b> ${e(si.why)}</p>`:''}${si.when_where?`<p><b>When/Where:</b> ${e(si.when_where)}</p>`:''}${si.how_to_study?`<p><b>How to Study:</b> ${e(si.how_to_study)}</p>`:''}${si.known_vs_debated?`<p><b>Known vs Debated:</b> ${e(si.known_vs_debated)}</p>`:''}${(si.themes&&si.themes.length)?`<div class="tags">${si.themes.map(t=>`<span class="tag">${e(t)}</span>`).join('')}</div>`:''}</section>`}

function passage(cp){return`<section class="card"><h3>${e(cp.title||'Complete Passage')}</h3>${cp.instruction?`<p style="color:var(--muted);font-size:13px;margin:0 0 12px">${e(cp.instruction)}</p>`:''}${(cp.ayahs||[]).map(a=>`<div class="pass"><span class="ref">${e(a.reference)}</span><div class="ar" dir="rtl">${e(a.arabic)}</div><div class="tr">${e(a.transliteration)}</div><div class="ru">${e(a.roman_urdu)}</div><div class="en">${e(a.english_meaning)}</div></div>`).join('')}</section>`}

function sections(ss){if(!ss||!ss.length)return'';return`<section class="card"><h3>Study Flow — Overview</h3>${ss.map(s=>`<div class="sec"><div class="sec-h"><span class="sec-t">${e(s.title)}</span><span class="sec-r">${e(s.ayah_range)}</span></div>${s.theme?`<div class="sec-th">${e(s.theme)}</div>`:''}${s.flow?`<p><b>Flow:</b> ${e(s.flow)}</p>`:''}${s.summary?`<p><b>Summary:</b> ${e(s.summary)}</p>`:''}${s.study_note?`<p class="note"><b>Note:</b> ${e(s.study_note)}</p>`:''}</div>`).join('')}</section>`}

function concl(t,c){if(!c)return'';const ms=(c.mindset_changes||[]).map(x=>`<span class="pill">${e(x)}</span>`).join('');const ch=(c.character_lessons||[]).map(x=>`<span class="pill">${e(x)}</span>`).join('');const ac=(c.action_plan||[]).map(a=>`<div class="ai"><div class="aih"><span class="ain">${e(a.action)}</span>${a.frequency?`<span class="aif">${e(a.frequency)}</span>`:''}</div>${a.how?`<p><b>How:</b> ${e(a.how)}</p>`:''}${a.why?`<p><b>Why:</b> ${e(a.why)}</p>`:''}</div>`).join('');
return`<section class="card"><h3>${e(t)}</h3>${c.complete_summary?`<p>${e(c.complete_summary)}</p>`:''}${c.what_it_teaches?`<p><b>Teaches:</b> ${e(c.what_it_teaches)}</p>`:''}${c.why_it_matters?`<p><b>Why:</b> ${e(c.why_it_matters)}</p>`:''}${c.what_i_should_understand?`<p><b>Understand:</b> ${e(c.what_i_should_understand)}</p>`:''}${c.what_i_should_do?`<p><b>Do:</b> ${e(c.what_i_should_do)}</p>`:''}${c.how_to_apply?`<p><b>How to apply:</b> ${e(c.how_to_apply)}</p>`:''}${c.what_to_avoid?`<p><b>Avoid:</b> ${e(c.what_to_avoid)}</p>`:''}${ms?`<div class="blk"><h4>Mindset Changes</h4><div class="tags">${ms}</div></div>`:''}${ch?`<div class="blk"><h4>Character Lessons</h4><div class="tags">${ch}</div></div>`:''}${ac?`<div class="blk"><h4>Action Plan</h4>${ac}</div>`:''}${c.one_sentence_lesson?`<div class="hb"><div class="hl">One-Sentence Lesson</div>${e(c.one_sentence_lesson)}</div>`:''}${c.one_sentence_action?`<div class="hb" style="margin-top:9px"><div class="hl">One-Sentence Action</div>${e(c.one_sentence_action)}</div>`:''}${c.one_sentence_reminder?`<div class="hb" style="margin-top:9px"><div class="hl">Reminder</div>${e(c.one_sentence_reminder)}</div>`:''}</section>`}

function srcs(ss){if(!ss||!ss.length)return'';return`<section class="card"><h3>Sources</h3>${ss.map(s=>`<div class="si"><div class="st">${e(s.type||'')}</div><div class="stt">${e(s.title||'')}</div>${s.reference?`<div class="sr">${e(s.reference)}</div>`:''}${s.url?`<div class="su2">${e(s.url)}</div>`:''}</div>`).join('')}</section>`}

function prog(p){if(!p)return'';const r=[['Current PDF',p.current_pdf],['Completed Range',p.completed_range],['Next PDF',p.next_pdf_suggested],['Next Range',p.next_range_suggested],['Surah Complete',p.surah_complete?'Yes':'No']].filter(x=>x[1]!=null&&x[1]!=='');if(!r.length)return'';return`<section class="card"><h3>Progress</h3><div class="ig">${r.map(([k,v])=>`<div class="ii"><div class="k">${e(k)}</div><div class="v">${e(v)}</div></div>`).join('')}</div></section>`}

function build(d){
const pj=d.project||{},si=d.surah_info||{},sr=d.study_range||{},cp=d.complete_passage||{},ss=d.sections||[],aa=d.ayahs||[],pr=d.pdf_range_conclusion||{},sc=d.surah_conclusion||{},so=d.sources||[],pg=d.progress||{};
const rs=sr.range||`${sr.surah_number||''}:${sr.ayah_start||''}–${sr.ayah_end||''}`;
return`<header class="dh"><div class="dk">${e(pj.name||'Quran Deep Study')}</div><h1>${e(si.name_meaning||sr.surah_name||'Study')}</h1><div class="dr">Surah ${e(sr.surah_number!=null?sr.surah_number:'')} · Ayat ${e(sr.ayah_start!=null?sr.ayah_start:'')}–${e(sr.ayah_end!=null?sr.ayah_end:'')} · ${e(rs)}</div><div class="dm">${pj.pdf_id?`<span><b>PDF ID:</b> ${e(pj.pdf_id)}</span>`:''}${pj.version?`<span><b>Version:</b> ${e(pj.version)}</span>`:''}${pj.created_at?`<span><b>Created:</b> ${e(pj.created_at)}</span>`:''}${pj.created_by?`<span><b>By:</b> ${e(pj.created_by.type||'')}${pj.created_by.platform?' · '+e(pj.created_by.platform):''}${pj.created_by.model?' · '+e(pj.created_by.model):''}</span>`:''}</div>${pj.human_review_note?`<div class="dn">${e(pj.human_review_note)}</div>`:''}</header>${info(si)}${passage(cp)}${sections(ss)}<div style="text-align:center;margin:26px 0 18px"><h2 style="font-size:19px;color:var(--primary);margin:0">Detailed Ayah Study</h2><div style="font-size:12.5px;color:var(--muted);margin-top:4px">Arabic → transliteration → meaning → context</div></div>${aa.map(ayah).join('')}${concl('PDF Range Conclusion',pr)}${concl('Surah Conclusion',sc)}${srcs(so)}${prog(pg)}`}

function render(d){document.title=(d.surah_info&&d.surah_info.name_meaning)||'Quran Deep Study';ct.innerHTML=build(d);window.scrollTo(0,0)}

async function load(name){
const f=norm(name);if(!f){picker();return}
loading();
const u='../data/'+encodeURIComponent(f);
try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status} — ${u}`);const d=await r.json();render(d);fi.value=f}
catch(x){console.error(x);errScreen(`"${f}" load nahi ho paya.`,x&&x.message?x.message:String(x))}
}

lb.onclick=()=>{const v=fi.value.trim();if(!v)return;const u=new URL(location.href);u.searchParams.set('file',v);history.replaceState(null,'',u.toString());load(v)};
fi.onkeydown=e=>{if(e.key==='Enter')lb.click()};
pb.onclick=()=>window.print();

const fp=new URLSearchParams(location.search).get('file');
if(fp){fi.value=norm(fp);load(fp)}else{picker()}
})();
</script>
</body>
</html>
