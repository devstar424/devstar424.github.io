<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Quran Deep Study printable A4 study">
  <title>Quran Deep Study · Study</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body class="study-body">
  <nav class="study-toolbar" aria-label="Study controls">
    <button type="button" id="backBtn">← Back</button>
    <button type="button" id="homeBtn">⌂ Home</button>
    <div class="toolbar-title" id="toolbarTitle">Loading study…</div>
    <button type="button" id="printBtn" class="primary">Print / Save PDF</button>
  </nav>

  <main id="paperRoot" class="paper-root" aria-live="polite"></main>
  <div id="errorBox" class="error-box hidden"></div>

  <script src="js/app.js"></script>
  <script src="js/study.js"></script>
</body>
</html>
